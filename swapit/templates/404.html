{% extends "base.html" %}

{% block title %}Страница не найдена - SwapIt{% endblock %}

{% block content %}
<div class="error-container">
    <h1>404</h1>
    <h2>Страница не найдена</h2>
    <p>Извините, но страница, которую вы ищете, не существует или была перемещена.</p>
    <a href="{{ url_for('items_index') }}" class="btn btn-primary">Вернуться на главную</a>
</div>

<style>
.error-container {
    text-align: center;
    padding: 4rem 2rem;
    max-width: 800px;
    margin: 0 auto;
}

.error-container h1 {
    font-size: 6rem;
    color: #e74c3c;
    margin: 0;
    line-height: 1;
}

.error-container h2 {
    font-size: 2rem;
    color: #2c3e50;
    margin: 1rem 0;
}

.error-container p {
    font-size: 1.2rem;
    color: #7f8c8d;
    margin-bottom: 2rem;
}

.error-container .btn {
    padding: 0.8rem 2rem;
    font-size: 1.1rem;
}
</style>
{% endblock %}
