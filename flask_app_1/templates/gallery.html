<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Галерея мемов</title>
    <style>
        body {
            font-family: Times New Roman, sans-serif;
            padding: 20px;
            background-color: #f9f9f9;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            border: 2px solid #ccc;
            border-radius: 10px;
            padding: 15px;
            background: white;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }
        .caption {
            margin-top: 10px;
            font-weight: bold;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>Галерея собачьих мемов</h1>
    <div class="gallery">
        {% for img in images %}
        <div class="card">
            <img src="{{ url_for('static', filename=img) }}" alt="{{ img }}">
            <div class="caption">{{ img.split('.')[0] + ' dog' }}</div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
